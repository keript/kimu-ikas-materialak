name: Revisar y fusionar PR de Copilot

# Cada 2 horas: coge los PR de Copilot que ya no son borrador, los valida (contenido + A4 + juegos)
# y, si todo está bien, los fusiona y vuelve a publicar la web. Si algo falla, deja un comentario
# en el PR con el problema para que Copilot lo arregle. Los materiales nuevos siguen con
# "publicado": false (borrador): se ven en su enlace pero no en los menús hasta que se revisen.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: copilot-fusionar
  cancel-in-progress: false

jobs:
  fusionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          npm install --global lighthouse@12.8.2
      - name: Revisar y fusionar
        env:
          GH_TOKEN: ${{ github.token }}
          # Token personal de Iker (opcional): Copilot solo hace caso a comentarios de personas, no de bots.
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          exec > >(tee -a fusionar.log) 2>&1
          set -x
          set +e  # un PR con problemas no debe parar la revisión de los demás
          comentar() {
            if gh pr view "$1" --json labels -q '.labels[].name' | grep -qx pausa; then echo "En pausa: sin comentario a Copilot"; return; fi
            GH_TOKEN="${COPILOT_TOKEN:-$GH_TOKEN}" gh pr comment "$@"
          }
          git config user.name "kimu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fusionados=0
          # Copilot deja sus PR como borrador. Cuando termina («copilot_work_finished» es su último evento), lo marcamos listo.
          for n in $(gh pr list --state open --json number,isDraft,author --jq '.[] | select(.isDraft == true) | select(.author.login | test("copilot"; "i")) | .number'); do
            ultimo=$(gh api "repos/${{ github.repository }}/issues/$n/timeline?per_page=100" --paginate --jq '.[] | select(.event | test("^copilot_work_")) | .event' | tail -1 || true)
            if [ "$ultimo" = "copilot_work_finished" ]; then gh pr ready "$n" || true; fi
          done
          for n in $(gh pr list --state open --json number,isDraft,author --jq '.[] | select(.isDraft == false) | select(.author.login | test("copilot"; "i")) | .number'); do
            echo "== PR #$n"
            sha=$(gh pr view "$n" --json headRefOid -q .headRefOid)
            etiq=$(gh pr view "$n" --json labels -q '[.labels[].name]|join(",")')
            # Cola (scripts/ilara.py): en «pausa» se fusiona si ya está bien, pero no se pide nada a Copilot.
            # «berrikusi» = reanudado: se revisa otra vez aunque no haya cambios nuevos.
            if [[ ",$etiq," == *",berrikusi,"* ]]; then
              gh pr edit "$n" --remove-label berrikusi
            elif gh pr view "$n" --json comments -q '.comments[].body' | grep -q "kimu-revision:$sha"; then
              echo "Ya revisado sin cambios nuevos"; continue
            fi
            git checkout -q main && git reset -q --hard origin/main
            gh pr checkout "$n" -f
            if ! git merge -q --no-edit origin/main; then
              git merge --abort || true
              comentar "$n" --body "@copilot Hay conflictos con \`main\`. Actualiza la rama con \`main\` y resuelve los conflictos, por favor. <!-- kimu-revision:$sha -->"
              continue
            fi
            ids=$(git diff --name-only origin/main...HEAD -- contenido/fitxak/ | sed -n 's#contenido/fitxak/\(.*\)\.json#\1#p' | paste -sd, -)
            kal_ok=true; rm -f revisar-kalitatea.log check.log build.log revisar.log web.log lighthouse.log
            if [ -n "$ids" ]; then python scripts/kalitatea.py --solo "$ids" --min 9.8 > revisar-kalitatea.log 2>&1 || kal_ok=false; fi
            validaciones_ok=false; web_ok=false
            if $kal_ok && python scripts/build.py --check > check.log 2>&1 && python scripts/build.py > build.log 2>&1 && python scripts/revisar_hojas.py _site > revisar.log 2>&1; then
              validaciones_ok=true
              area=$(python - <<'PY'
          import json
          from pathlib import Path
          for ruta in sorted(Path("contenido/arloak").glob("*.json")):
              arlo = json.loads(ruta.read_text(encoding="utf-8"))
              if arlo.get("estado") == "activo" and Path("_site", f'{arlo["id"]}.html').is_file():
                  print(f'{arlo["id"]}.html')
                  break
          PY
              )
              ficha=$(python - <<'PY'
          import json
          from pathlib import Path
          for ruta in sorted(Path("contenido/fitxak").glob("*.json")):
              ficha = json.loads(ruta.read_text(encoding="utf-8"))
              if ficha.get("publicado") and Path("_site", f'{ficha["id"]}.html').is_file():
                  print(f'{ficha["id"]}.html')
                  break
          PY
              )
              juego=$(find _site -maxdepth 1 -name '*-jolasa.html' -printf '%f\n' | sort | head -1)
              paginas=(index.html lh-1.html "$area" "$ficha" "$juego")
              python -m http.server 8765 --directory _site > /tmp/kimu-web-server.log 2>&1 &
              servidor=$!
              for intento in {1..20}; do
                if curl --silent --fail http://127.0.0.1:8765/index.html > /dev/null; then break; fi
                sleep 1
              done
              web_ok=true
              python scripts/revisar_web.py --base-url http://127.0.0.1:8765 --width 390 --pages "${paginas[@]}" > web.log 2>&1 || web_ok=false
              chrome_path=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
              for pagina in "${paginas[@]}"; do
                informe="/tmp/lighthouse-${pagina%.html}.json"
                CHROME_PATH="$chrome_path" lighthouse "http://127.0.0.1:8765/$pagina" \
                  --chrome-flags="--headless --no-sandbox" --form-factor=mobile \
                  --only-categories=accessibility,best-practices,seo,performance \
                  --output=json --output-path="$informe" --quiet >> lighthouse.log 2>&1 || web_ok=false
                python - "$informe" "$pagina" <<'PY' >> lighthouse.log 2>&1 || web_ok=false
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          thresholds = {"accessibility": 95, "best-practices": 95, "seo": 95, "performance": 90}
          failed = []
          for category, minimum in thresholds.items():
              score = report["categories"][category]["score"]
              score = score * 100 if score is not None else 0
              print(f'{sys.argv[2]}: {category} {score:.1f}/100 (mínimo {minimum})')
              if score < minimum:
                  failed.append(f'{category} {score:.1f} < {minimum}')
                  for ref in report["categories"][category]["auditRefs"]:
                      audit = report["audits"][ref["id"]]
                      if audit.get("score") not in (None, 1):
                          print(f'  Falla: {audit["title"]}')
          if failed:
              raise SystemExit("No cumple Lighthouse: " + ", ".join(failed))
          PY
              done
              kill "$servidor" 2>/dev/null || true
            fi
            if $validaciones_ok && $web_ok; then
              gh pr merge "$n" --squash --delete-branch && fusionados=$((fusionados+1))
              git checkout -q main && git pull -q
            else
              {
                echo "@copilot La revisión automática ha encontrado problemas. Arréglalos, por favor:"
                echo; echo '```'; tail -n 40 revisar-kalitatea.log check.log build.log revisar.log web.log lighthouse.log 2>/dev/null || true; echo; echo "Receta de calidad: docs/kalitatea.md (mínimo 9,8/10 por ficha)"; echo '```'
                echo "<!-- kimu-revision:$sha -->"
              } > comentario.md
              comentar "$n" --body-file comentario.md
            fi
          done
          # Los push hechos con el token de Actions no lanzan otros workflows: se lanzan a mano.
          if [ "$fusionados" -gt 0 ]; then gh workflow run audioak.yml --ref main; gh workflow run publicar.yml --ref main; fi
          echo "Fusionados: $fusionados"
      - name: Si falla, dejar el registro en un issue (para revisarlo sin descargar logs)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Kimu: revisor log in:title" --json number -q '.[0].number')
          [ -n "$n" ] || n=$(gh issue create --title "🔧 Kimu: revisor log" --body "Registros de fallos del revisor automático." | sed 's#.*/##')
          { echo '```'; tail -n 60 fusionar.log; echo '```'; } > fallo.md
          gh issue comment "$n" --body-file fallo.md
