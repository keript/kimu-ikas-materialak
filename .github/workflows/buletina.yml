name: Boletín mensual (Buttondown, en pausa)

# Día 1 de cada mes a las 8:40 (invierno): crea el BORRADOR del boletín y avisa a Iker. Nunca envía solo.
# En pausa desde el 2-11-2026: la lista de correo pasa a MailerLite (ver docs/buletina.md). Solo manual.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "proba (comprobar clave) o zirriborroa (crear borrador)"
        default: proba

permissions:
  contents: read
  issues: write

jobs:
  buletina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buttondown
        env:
          GH_TOKEN: ${{ github.token }}
          IKER: ${{ github.repository_owner }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/buletina.py "${{ github.event.inputs.modo || 'zirriborroa' }}"
