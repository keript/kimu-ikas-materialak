name: Kimuren ahotsa (reels)

on:
  workflow_dispatch:
    inputs:
      izena:
        description: "Nombre del archivo (sin .mp3)"
        required: true
      testua:
        description: "Texto en euskera; separa frases con \\n"
        required: true
      ahotsa:
        description: "eu-ES-AinhoaNeural o eu-ES-AnderNeural"
        default: eu-ES-AinhoaNeural
      tonua:
        description: "Tono, p. ej. +0% o +6%"
        default: "+0%"
      abiadura:
        description: "Velocidad, p. ej. +0% o +8%"
        default: "+0%"
      naturala:
        description: "1 = variar ritmo y pausas entre frases"
        default: "1"

permissions:
  contents: write

jobs:
  ahotsa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar voz
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TESTUA: ${{ github.event.inputs.testua }}
          IZENA: ${{ github.event.inputs.izena }}
          AHOTSA: ${{ github.event.inputs.ahotsa }}
          TONUA: ${{ github.event.inputs.tonua }}
          ABIADURA: ${{ github.event.inputs.abiadura }}
          NATURALA: ${{ github.event.inputs.naturala == '1' && '1' || '' }}
        run: cd scripts && cd .. && PYTHONPATH=scripts python scripts/kimu_ahotsa.py
      - name: Guardar
        run: |
          git config user.name "kimu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/ahotsa
          git commit -m "Kimuren ahotsa: ${{ github.event.inputs.izena }}" && for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
