<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:N;src:url(file:///home/claude/kimu-ikas-materialak/estatico/fonts/nunito-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:N;src:url(file:///home/claude/kimu-ikas-materialak/estatico/fonts/nunito-latin-800-normal.woff2);font-weight:800}
*{box-sizing:border-box}body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:N;background:#f6f1e3;color:#20241f}
.sc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.top{position:absolute;top:120px;left:0;right:0;text-align:center;font-weight:900;font-size:62px;color:#3f7a22}
.big{font-size:118px;font-weight:900;line-height:1.02;letter-spacing:-3px;padding:0 70px}
.big b{color:#3f7a22}
.pic{width:620px;height:620px;border-radius:60px;background:#fff;border:6px solid #20241f;box-shadow:16px 16px 0 #b8f36b;display:flex;align-items:center;justify-content:center}
.pic img{width:440px}
.word{margin-top:90px;display:flex;gap:16px;justify-content:center}
.l{width:96px;height:120px;border-bottom:10px solid #20241f;font-size:100px;font-weight:900;line-height:118px}
.l.on{color:#3f7a22}
.cd{position:absolute;bottom:230px;left:50%;transform:translateX(-50%);width:190px;height:190px;border-radius:50%;background:#20241f;color:#b8f36b;font-size:120px;font-weight:900;display:flex;align-items:center;justify-content:center}
.num{position:absolute;top:240px;left:0;right:0;font-size:52px;font-weight:800;color:#6b6f63}
.foot{position:absolute;bottom:90px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;font-size:44px;font-weight:800}
.foot img{height:80px}
.pill{display:inline-block;margin-top:60px;background:#b8f36b;border:5px solid #20241f;border-radius:70px;padding:22px 50px;font-size:58px;font-weight:900}
</style></head><body>
<div class="top" id="top">🍂 Udazkena</div>
<div class="sc" id="intro"><div class="big">Asmatu hitza<br><b>5 segundotan</b> ⏱️</div><div class="pill">Prest? 👇</div></div>
<div class="sc" id="game"><div class="num" id="num"></div><div class="pic"><img id="img"></div><div class="word" id="word"></div><div class="cd" id="cd"></div></div>
<div class="sc" id="outro"><div class="big">Zenbat asmatu<br>dituzu? <b>👇</b></div><div style="font-size:54px;font-weight:800;margin-top:60px;padding:0 90px;line-height:1.3">Idatzi iruzkinetan.<br>Gelarako fitxak eta jolasak, doan: esteka bioan.</div><div class="pill">Gorde 📌 gelarako</div></div>
<div class="foot"><img src="file:///home/claude/kimu-ikas-materialak/estatico/kimu.svg">@kimumaterialak</div>
<script>
const W=[["GAZTAINA","chestnut"],["URTXINTXA","urtxintxa"],["HOSTOA","hostoa"],["HONTZA","owl"]];
const IR="file:///home/claude/kimu-ikas-materialak/estatico/irudiak/";
const INTRO=2.5,R=4.5,OUT=4;window.DUR=INTRO+W.length*R+OUT;
function show(id){for(const s of ["intro","game","outro"])document.getElementById(s).style.display=s==id?"flex":"none"}
window.render=function(t){
 if(t<INTRO){show("intro");return}
 const k=Math.floor((t-INTRO)/R);
 if(k>=W.length){show("outro");return}
 show("game");const lt=t-INTRO-k*R,[w,im]=W[k];
 document.getElementById("num").textContent=(k+1)+" / "+W.length;
 const img=document.getElementById("img");if(!img.src.endsWith(im+".svg"))img.src=IR+im+".svg";
 const rev=lt>=3.6;
 document.getElementById("word").innerHTML=[...w].map((c,i)=>`<div class="l ${rev?'on':''}">${rev||i==0||i==w.length-1?c:''}</div>`).join("");
 const cd=document.getElementById("cd");
 if(lt<3.6){cd.style.display="flex";cd.textContent=Math.max(1,5-Math.floor(lt/0.72))}else{cd.style.display="flex";cd.textContent="✓"}
}
render(0);
</script></body></html>
