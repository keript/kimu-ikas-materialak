name: Sare sozialetako materiala sortu

on:
  push:
    branches: [main]
    paths:
      - "contenido/fitxak/*.json"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sare-sozialak
  cancel-in-progress: false

jobs:
  sortu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalatu Playwright eta arakatzailea
        run: |
          pip install -r requirements-social.txt
          playwright install --with-deps chromium
      - name: Instalatu ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sortu webgunea
        run: python scripts/build.py
      - name: Aukeratu fitxa berriak
        id: ids
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          event = os.environ["EVENT_NAME"]
          ids = ""
          if event == "push" and os.environ["EVENT_BEFORE"] != "0000000000000000000000000000000000000000":
              result = subprocess.run(
                  ["git", "diff", "--diff-filter=AM", "--name-only",
                   os.environ["EVENT_BEFORE"], os.environ["EVENT_SHA"], "--", "contenido/fitxak"],
                  check=True, text=True, capture_output=True,
              )
              ids = ",".join(
                  path.removeprefix("contenido/fitxak/").removesuffix(".json")
                  for path in result.stdout.splitlines() if path.endswith(".json")
              )
          print(f"ids={ids}")
          PY
      - name: Sortu reel-ak
        if: steps.ids.outputs.ids != ''
        run: python scripts/reel.py --ids "${{ steps.ids.outputs.ids }}"
      - name: Sortu asteko bozketa
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sare_sozialak.py --portadak --bozketa
      - name: Sortu nabarmentzeko portadak
        if: github.event_name == 'push'
        run: python scripts/sare_sozialak.py --portadak
      - name: Egiaztatu bideoak sortu direla
        id: reels
        if: steps.ids.outputs.ids != ''
        run: |
          if compgen -G "sare-sozialak/*/reel.mp4" > /dev/null; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Gorde argitaratzeko fitxategiak
        id: artifaktua
        if: steps.reels.outputs.created == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sare-sozialak-${{ github.run_number }}
          path: |
            sare-sozialak/*/reel.mp4
            sare-sozialak/*-bozketa.png
            sare-sozialak/destakatuak/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Erantsi esteka asteko issue-an
        if: steps.reels.outputs.created == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/sare_sozialak.py --issue
