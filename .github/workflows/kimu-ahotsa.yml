name: Kimuren ahotsa (reels)

on:
  workflow_dispatch:
    inputs:
      izena:
        description: "Nombre del archivo (sin .mp3)"
        required: true
      testua:
        description: "Texto en euskera; separa frases con \\n"
        required: true

permissions:
  contents: write

jobs:
  ahotsa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar voz
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TESTUA: ${{ github.event.inputs.testua }}
          IZENA: ${{ github.event.inputs.izena }}
        run: cd scripts && cd .. && PYTHONPATH=scripts python scripts/kimu_ahotsa.py
      - name: Guardar
        run: |
          git config user.name "kimu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/ahotsa
          git commit -m "Kimuren ahotsa: ${{ github.event.inputs.izena }}" && git pull --rebase -q origin main && git push
