name: Proba COPILOT_TOKEN
on: workflow_dispatch
jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          gh api repos/${{ github.repository }} --jq '"repo ok: " + .full_name + " push=" + (.permissions.push|tostring)'
          gh api repos/${{ github.repository }}/issues/112/assignees -X POST -f "assignees[]=copilot-swe-agent[bot]" --jq '[.assignees[].login]|join(",")' || echo "assign FAIL"
          gh api repos/${{ github.repository }}/issues/112/assignees -X DELETE -f "assignees[]=copilot-swe-agent[bot]" --jq '.number' || true
